name: CI / CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas (HTML5, semántica, WCAG AA, ARIA, seguridad, adaptabilidad)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar CSS (Tailwind v4)
        run: npm run build:css

      - name: Validar que el CSS compilado este versionado
        run: git diff --exit-code -- css/app.css

      - name: HTML5 y sintaxis (htmlhint)
        run: npm test

      - name: HTML semantico + WCAG AA + ARIA (html-validate)
        run: npm run test:semantic

      - name: Accesibilidad WCAG AA / ARIA (axe-core)
        run: npm run test:a11y

      - name: Seguridad de enlaces (YouTube/https) y adaptabilidad
        run: npm run test:security

  deploy:
    name: Publicar en GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto del sitio
        run: |
          mkdir -p site
          cp index.html site/
          cp .nojekyll site/
          cp -r css js images site/

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4